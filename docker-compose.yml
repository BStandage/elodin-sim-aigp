# One-command sim environment:
#
#     docker compose up --build         # headless race (RACE_SOLVER, default solvers.follower)
#     docker compose run --rm sim bash  # shell inside the environment (tests, scripts)
#
# Watch a run live with the NATIVE editor for your platform, pointed at
# localhost:2240 (no WSL-IP dance needed — Docker publishes the port):
#     elodin editor localhost:2240
#
# Override race knobs per-run, e.g.:
#     RACE_SOLVER=solver.baseline AIGP_SIM_TIME=60 docker compose up

services:
  sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: elodin-sim-aigp
    # Elodin ships x86_64 Linux binaries only. Apple Silicon Macs run this
    # under emulation: Docker Desktop -> Settings -> "Use Rosetta for
    # x86_64/amd64 emulation" (much faster than QEMU).
    platform: linux/amd64
    # Elodin hard-requires io_uring (the README's kernel>=5.10 note);
    # Docker's default seccomp profile blocks the io_uring syscalls.
    security_opt:
      - seccomp:unconfined
    ports:
      - "2240:2240"    # Elodin render server (editor connects here)
      - "5761:5761"    # Betaflight SITL MSP/CLI: the configurator (manual TCP connection) and AI-GrandPrix hardware.bench --tcp 127.0.0.1:5761
    environment:
      RACE_SOLVER: ${RACE_SOLVER:-solvers.follower}
      AIGP_SIM_TIME: ${AIGP_SIM_TIME:-250.0}
      AIGP_TRAJ: ${AIGP_TRAJ:-}         # explicit plan path (container side); empty = entrypoint picks plan_RACE.json
      AIGP_LAPS: ${AIGP_LAPS:-}     # empty = take laps from the plan (entrypoint)
      AIGP_REALTIME: ${AIGP_REALTIME:-1}
      AIGP_VEHICLE_TOML: ${AIGP_VEHICLE_TOML:-}   # container-side toml path; empty = entrypoint derives it from the plan
      AIGP_ANGLE_MODE: ${AIGP_ANGLE_MODE:-0}       # 1 = solvers.follower flies Betaflight ANGLE mode (aux2 high, tilt-angle sticks)
      AIGP_SEEKER_CFG: ${AIGP_SEEKER_CFG:-{}}      # JSON overrides for seeker.brain.SeekerConfig
      AIGP_STATE_SOURCE: ${AIGP_STATE_SOURCE:-ground_truth}   # deadreckon = vision-aided dead reckoning (no ground-truth position)
      AIGP_CAM_TILT_DEG: ${AIGP_CAM_TILT_DEG:-20}      # synthetic camera mount tilt (deg up)
      AIGP_CAM_HFOV_DEG: ${AIGP_CAM_HFOV_DEG:-90}      # synthetic camera horizontal field of view
      AIGP_SEEKER_DET: ${AIGP_SEEKER_DET:-synthetic}   # seeker detector: synthetic or camera
      AIGP_CAM_NOISE: ${AIGP_CAM_NOISE:-1}      # 0 = perfect synthetic detector (diagnostics only)
      AIGP_SEED: ${AIGP_SEED:-0}                # synthetic detector noise seed
      AIGP_SENSOR_NOISE: ${AIGP_SENSOR_NOISE:-1}     # 0 = clean sensors (diagnostics)
      AIGP_BARO_PATHOLOGY: ${AIGP_BARO_PATHOLOGY:-1}   # 0 = plain-noise barometer (the d43 case)
      AIGP_HOLD_HEIGHT: ${AIGP_HOLD_HEIGHT:-0}     # 1 = the commit hold flies a height fitted from the elevation history
      AIGP_VERT: ${AIGP_VERT:-baro}             # vision = the follower's vertical channel nulls the gate's elevation (the hardware mode)
      AIGP_GATE_COMMIT_FRAC: ${AIGP_GATE_COMMIT_FRAC:-0.85}   # commit-through-the-gate size fraction (sim mirrors the runtime)
    volumes:
      # Both repos live on the host, side by side, exactly like the
      # WSL/native setup — edit solver code on the host, run in here.
      - .:/work/elodin-sim-aigp
      - ../AI-GrandPrix:/work/AI-GrandPrix
      # Python env + uv cache on fast VM disk (a venv on a Windows/Mac
      # bind mount is slow and symlink-hostile). Seeded from the image.
      - venv:/opt/venv
      - uv-cache:/root/.cache/uv
      # Betaflight build artifacts stay off the host repo and survive
      # container recreation (first run builds SITL once, ~2-5 min).
      - bf-build:/work/elodin-sim-aigp/betaflight/obj
      # Live elodin_db writes (per-entity, per-tick) are also too slow on a
      # Windows/Mac bind mount — measured ~2 min between entity inserts,
      # which starves the render server's camera warm-up window and leaves
      # the viewport empty. Off the mount, onto fast VM disk.
      - sim-run:/work/elodin-sim-aigp/run

volumes:
  venv:
  uv-cache:
  bf-build:
  sim-run: